[build-system]
requires = ["pdm-backend[scm]"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"

[project]
name = "apbs"
description = "Automatic plant watering system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-bootstrap5>=26.2",
    "gunicorn>=26.0.0",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
]

dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
